[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfilingrag"
version = "0.1.0"
description = "Dynamic, filing-aware RAG prototype for company-disclosure analysis (10-K/10-Q/annual reports)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenFilingRAG Contributors" }]
keywords = ["rag", "langgraph", "sec-filings", "10-k", "fastapi", "pgvector", "alpha-vantage", "massive"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-postgres>=0.0.13",
    "openai>=1.40.0",
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "docling>=2.0",
    "docling-core>=2.0",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "rapidfuzz>=3.9.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/yybrother989/openfilingrag"
Documentation = "https://github.com/yybrother989/openfilingrag#readme"
Repository = "https://github.com/yybrother989/openfilingrag"
Issues = "https://github.com/yybrother989/openfilingrag/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "frontend*", "scripts*", "demo*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: marks tests requiring a live Postgres/pgvector container",
    "external_api: marks tests requiring real external API keys",
]
